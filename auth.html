<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Login / Register — TravelAI</title>
<link rel="stylesheet" href="assets/style.css"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet"/>
</head>
<body>
<nav class="navbar" id="navbar">
  <div class="nav-container">
    <a href="index.html" class="nav-logo"><span class="logo-icon">✈</span> TravelAI</a>
    <ul class="nav-links" id="navLinks">
      <li><a href="index.html">Home</a></li>
      <li><a href="planner.html">Plan Trip</a></li>
      <li><a href="explore.html">Explore</a></li>
    </ul>
    <div class="nav-actions">
      <button class="theme-toggle" id="themeToggle">🌙</button>
      <button class="hamburger" id="hamburger">&#9776;</button>
    </div>
  </div>
</nav>

<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">
      <div>✈ TravelAI</div>
      <div style="font-size:0.78rem;font-weight:400;color:var(--text-muted);margin-top:0.2rem">Powered by IBM Granite AI</div>
    </div>

    <div class="auth-tabs">
      <div class="auth-tab active" data-form="loginForm">Sign In</div>
      <div class="auth-tab" data-form="registerForm">Register</div>
    </div>

    <!-- Login Form -->
    <div id="loginForm" class="auth-form">
      <div class="form-group">
        <label class="form-label">Email Address</label>
        <input type="email" class="form-input" placeholder="you@example.com"/>
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input type="password" class="form-input" placeholder="Enter your password"/>
      </div>
      <button class="btn btn-primary" style="width:100%;justify-content:center;margin-top:0.5rem" onclick="handleAuth('login')">
        🚀 Sign In
      </button>
      <div class="auth-divider">or continue with</div>
      <div style="display:flex;gap:0.7rem">
        <button class="btn btn-outline" style="flex:1;justify-content:center">🔵 Google</button>
        <button class="btn btn-outline" style="flex:1;justify-content:center">⬛ GitHub</button>
      </div>
      <p style="text-align:center;margin-top:1rem;font-size:0.83rem;color:var(--text-muted)">
        Forgot password? <a href="#">Reset here</a>
      </p>
    </div>

    <!-- Register Form -->
    <div id="registerForm" class="auth-form hidden">
      <div class="form-grid-2">
        <div class="form-group">
          <label class="form-label">First Name</label>
          <input type="text" class="form-input" placeholder="Rahul"/>
        </div>
        <div class="form-group">
          <label class="form-label">Last Name</label>
          <input type="text" class="form-input" placeholder="Sharma"/>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Email Address</label>
        <input type="email" class="form-input" placeholder="you@example.com"/>
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input type="password" class="form-input" placeholder="Min 8 characters"/>
      </div>
      <div class="form-group" style="display:flex;align-items:flex-start;gap:0.5rem">
        <input type="checkbox" id="agreeTerms" style="margin-top:3px;accent-color:var(--primary)"/>
        <label for="agreeTerms" style="font-size:0.83rem;color:var(--text-muted);cursor:pointer">
          I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>
        </label>
      </div>
      <button class="btn btn-primary" style="width:100%;justify-content:center" onclick="handleAuth('register')">
        ✨ Create Account
      </button>
    </div>

    <div id="authAlert" class="alert" style="display:none;margin-top:1rem"></div>
  </div>
</div>

<script src="assets/main.js"></script>
<script>
function handleAuth(type) {
  const alertEl = document.getElementById('authAlert');
  alertEl.className = 'alert alert-success';
  alertEl.innerHTML = type === 'login'
    ? '✅ <b>Signed in!</b> Redirecting to your dashboard…'
    : '🎉 <b>Account created!</b> Welcome to TravelAI!';
  alertEl.style.display = 'block';
  setTimeout(() => { window.location.href = 'dashboard.html'; }, 1200);
}

// Handle #register anchor
if (window.location.hash === '#register') {
  document.querySelector('[data-form="registerForm"]')?.click();
}
</script>
</body>
</html>
